<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Audio + Color Palette Activity</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
    }

    #paletteContainer {
      display: flex;
      gap: 15px;
    }

    .colorCircle {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      border: 3px solid #333;
      background-color: white;
    }

    #colorPickerSection {
      display: none;
      flex-direction: column;
      gap: 10px;
      padding: 10px;
      border: 2px solid #333;
      background: #fafafa;
      border-radius: 10px;
    }
  </style>
</head>
<body>
  <h2>Audio + Color Palette Activity</h2>

  <audio id="audio" controls>
    <source src="../audios/test.wav" type="audio/mpeg" />
  </audio>

  <button id="startSequence">Start Palette Activity</button>

  <div id="colorPickerSection">
    <label for="colorPicker">Choose a color:</label>
    <input type="color" id="colorPicker" />
    <button id="confirmColor" style="padding: 10px; font-size: 16px; background:#4CAF50; color:white; border:none; border-radius:6px;">Confirm Color</button>
  </div>

  <h3>Your Color Palette:</h3>
  <div id="paletteContainer">
    <div class="colorCircle"></div>
    <div class="colorCircle"></div>
    <div class="colorCircle"></div>
    <div class="colorCircle"></div>
    <div class="colorCircle"></div>
  </div>

  <script>
    const audio = document.getElementById("audio");
    const startBtn = document.getElementById("startSequence");
    const colorSection = document.getElementById("colorPickerSection");
    const colorPicker = document.getElementById("colorPicker");
    const confirmBtn = document.getElementById("confirmColor");
    const circles = document.querySelectorAll(".colorCircle");

    let colorIndex = 0;
    let autoStopTime = 5; // seconds

    // Auto-stop at 5 seconds
    // Immediately show picker when audio auto-stops
    audio.addEventListener("timeupdate", () => {
      if (audio.currentTime >= autoStopTime) {
        audio.pause();
        colorSection.style.display = "flex";
      }
    });

    // Start button resets everything
    startBtn.addEventListener("click", () => {
      colorIndex = 0;
      circles.forEach(c => c.style.backgroundColor = "white");

      audio.currentTime = 0;
      audio.play();

      colorSection.style.display = "none";
    });

    // Confirm selected color
    confirmBtn.addEventListener("click", () => {
      if (colorIndex < 5) {
        circles[colorIndex].style.backgroundColor = colorPicker.value;
        colorIndex++;
      }

      if (colorIndex >= 5) {
        colorSection.style.display = "none";
        audio.play(); // resume audio
      }
    });
  </script>
</body>
</html>
